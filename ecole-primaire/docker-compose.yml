# =====================================================================
#  Gestion d'école primaire — lancement complet avec Docker
#
#    docker compose up -d --build        → http://localhost:3000
#    docker compose --profile tunnel up -d   → ajoute le lien public Cloudflare (option A)
#
#  Services :
#    app        interface web + API REST (Node.js / Express)
#    db         base de données PostgreSQL 16
#    sauvegarde copie quotidienne de la base et des fichiers dans ./sauvegardes (30 jours)
#    tunnel     (facultatif) Cloudflare Quick Tunnel : lien https://….trycloudflare.com
# =====================================================================
name: ecole-primaire

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ecole
      POSTGRES_USER: ecole
      POSTGRES_PASSWORD: ${DB_PASSWORD:-ecole_mdp}
      TZ: Africa/Tunis
      PGTZ: Africa/Tunis
    volumes:
      - donnees-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ecole -d ecole"]
      interval: 5s
      timeout: 5s
      retries: 30

  app:
    build: .
    image: ecole-primaire:1.0
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://ecole:${DB_PASSWORD:-ecole_mdp}@db:5432/ecole
      SEED_DEMO: ${SEED_DEMO:-true}
      DEMO_MODE: ${DEMO_MODE:-true}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_MOT_DE_PASSE: ${ADMIN_MOT_DE_PASSE:-}
      PUBLIC_URL: ${PUBLIC_URL:-}
      JWT_SECRET: ${JWT_SECRET:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM: ${SMTP_FROM:-}
      TAILLE_MAX_FICHIER_MO: ${TAILLE_MAX_FICHIER_MO:-10}
    ports:
      - "${PORT_APP:-3000}:3000"
    volumes:
      - fichiers:/app/uploads
      - ./sauvegardes:/sauvegardes:ro   # lecture seule : sert à restaurer les fichiers

  sauvegarde:
    image: postgres:16-alpine
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGPASSWORD: ${DB_PASSWORD:-ecole_mdp}
      TZ: Africa/Tunis
    volumes:
      - ./sauvegardes:/sauvegardes
      - fichiers:/fichiers:ro
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        sleep 30
        while true; do
          horodatage=$$(date +%Y-%m-%d_%H%M)
          if pg_dump -h db -U ecole -d ecole -F c -f /sauvegardes/ecole_$$horodatage.dump; then
            echo "Base sauvegardée : ecole_$$horodatage.dump"
          else
            echo "ÉCHEC de la sauvegarde de la base"
          fi
          if tar czf /sauvegardes/fichiers_$$horodatage.tgz -C /fichiers .; then
            echo "Fichiers sauvegardés : fichiers_$$horodatage.tgz"
          else
            echo "ÉCHEC de la sauvegarde des fichiers"
          fi
          find /sauvegardes \( -name 'ecole_*.dump' -o -name 'fichiers_*.tgz' \) -mtime +30 -delete
          sleep 86400
        done

  tunnel:
    image: cloudflare/cloudflared:latest
    profiles: ["tunnel"]
    restart: unless-stopped
    depends_on:
      - app
    command: tunnel --no-autoupdate --url http://app:3000

volumes:
  donnees-db:
  fichiers:
